seed: 42
run_name: "curriculum_auto_default_joint0_yaw_debug"

logging:
  save_dir: "runs"
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["curriculum-auto", "default", "joint0-yaw-debug", "latest-base"]
  notes: "Automatic curriculum runner rerun with joint0-target yaw debug instrumentation"

curriculum:
  eval_freq: 5000
  n_eval_episodes: 20
  deterministic_eval: true
  stages:
    - name: "stage1"
      config: "fixed_center_stage1_300k.yaml"
      min_timesteps: 10000
      max_timesteps: 300000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/release_rate"
            op: ">="
            value: 0.95
            consecutive: 3
          - type: "threshold"
            metric: "valid/timeout_no_release_rate"
            op: "<="
            value: 0.05
            consecutive: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
    - name: "stage2"
      config: "narrow_random_stage2_300k.yaml"
      min_timesteps: 150000
      max_timesteps: 300000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/min_distance_to_target"
            op: "<="
            value: 0.13
            consecutive: 3
          - type: "plateau"
            metric: "valid/min_distance_to_target"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
    - name: "stage3"
      config: "random_full_stage3_300k.yaml"
      min_timesteps: 150000
      max_timesteps: 300000
      decision:
        action: "stop"
        logic: "all"
        conditions:
          - type: "plateau"
            metric: "valid/min_distance_to_target"
            mode: "min"
            window: 4
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 4
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
