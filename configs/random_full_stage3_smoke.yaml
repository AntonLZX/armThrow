seed: 42
run_name: "ppo_arm_throw_random_full_stage3_smoke"

env:
  arm_urdf: "arm.urdf"
  render: false
  max_steps: 240
  end_effector_link_index: 3
  accel_scale: 50.0
  motor_force_limit: 50.0
  joint_velocity_limit: 10.0
  target_radius: 0.1
  release_success_bonus: 0.0
  reward_mode: "distance_progress"
  observation_mode: "arm_target_release"

  target:
    mode: "random"
    fixed: [2.0, 0.0, 0.5]
    random:
      x: [1.8, 2.2]
      y: [-0.2, 0.2]
      z: [0.4, 0.6]

algo:
  name: "PPO"
  total_timesteps: 1536
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 64
  n_epochs: 2
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

logging:
  name: "auto"
  save_dir: "runs"
  gif_every_n_episodes: 1000000
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["ppo", "curriculum", "stage3", "smoke"]
  notes: "Smoke stage 3 config for curriculum automation"
  sync_tensorboard: false
  save_model: true

