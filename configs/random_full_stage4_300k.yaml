seed: 42
run_name: "ppo_arm_throw_random_full_stage3_300k"

env:
  arm_urdf: "arm.urdf"
  render: false
  max_steps: 240
  end_effector_link_index: 3
  accel_scale: 50.0
  motor_force_limit: 50.0
  joint_velocity_limit: 10.0
  target_radius: 0.1
  release_success_bonus: 0.0
  reward_mode: "distance_progress"
  observation_mode: "arm_target_release"

  target:
    mode: "random"
    fixed: [2.0, 0.0, 0.5]
    random:
      sampling_mode: "sphere_with_cylinder_exclusion"
      sphere:
        center: [2.0, 0.0, 0.5]
        radius: 0.2
      cylinder_exclusion:
        center: [2.0, 0.0, 0.5]
        radius: 0.05
        height: 0.3

algo:
  name: "PPO"
  total_timesteps: 300000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

logging:
  name: "auto"
  save_dir: "runs"
  gif_every_n_episodes: 1000000
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["ppo", "pybullet", "curriculum", "random-full", "stage3", "300k"]
  notes: "Curriculum stage 3: full random target"
  sync_tensorboard: false
  save_model: true
