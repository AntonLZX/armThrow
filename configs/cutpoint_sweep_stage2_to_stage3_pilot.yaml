seed: 42
run_name: "curriculum-cutpoint-sweep-stage2-to-stage3-pilot"

logging:
  save_dir: "runs"
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["curriculum-cutpoint-sweep", "stage2-to-stage3", "pilot"]
  notes: "Pilot harness for searching stage2 cutpoints and replaying stage3 transfer"
  sync_tensorboard: false

comparison_anchors:
  - candidate_type: "auto_default_anchor"
    label: "default-auto-history"
    source: "historical_reference"
    config: "curriculum_auto_default.yaml"
    note: "Reuse historical default-auto evidence for background comparison"
  - candidate_type: "replay_anchor"
    label: "replay-300-300-300-history"
    source: "historical_reference"
    config: "curriculum_auto_replay_300_300_300.yaml"
    note: "Replay 300/300/300 is the strong comparison anchor from the latest evidence"
  - candidate_type: "auto_default_anchor"
    label: "default-auto-rerun"
    source: "rerun_required"
    config: "curriculum_auto_default.yaml"
  - candidate_type: "replay_anchor"
    label: "replay-300-300-300-rerun"
    source: "rerun_required"
    config: "curriculum_auto_replay_300_300_300.yaml"

sweep:
  eval_freq: 5000
  n_eval_episodes: 20
  deterministic_eval: true
  success_threshold: 0.05
  stage2_early_window_timesteps: 50000
  stage3_early_window_timesteps: 100000
  bad_regime_ground_miss_threshold: 0.9

  prelude_stages:
    - name: "stage1"
      config: "fixed_center_stage1_300k.yaml"
      max_timesteps: 300000

  upstream:
    name: "stage2_bank"
    config: "narrow_random_stage2_600k.yaml"
    max_timesteps: 600000
    cutpoints: [150000, 200000, 250000, 300000, 400000, 500000, 600000]

  downstream_chain:
    - name: "stage3"
      config: "random_full_stage3_300k.yaml"
      max_timesteps: 300000
