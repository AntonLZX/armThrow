seed: 42
run_name: "debug-metric-followup-s1cut-600k-s2cut-600k-seed-42"

logging:
  save_dir: "runs"
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["curriculum-auto", "debug-metric-followup", "strongest-final", "s1cut-600k", "s2cut-600k", "seed-42"]
  notes: "Follow-up replay of strongest final cutpoint chain to add yaw and joint0 debug metrics"

curriculum:
  eval_freq: 5000
  n_eval_episodes: 20
  deterministic_eval: true
  stages:
    - name: "stage1"
      config: "fixed_center_stage1_600k.yaml"
      min_timesteps: 600000
      max_timesteps: 600000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/release_rate"
            op: ">="
            value: 0.95
    - name: "stage2"
      config: "narrow_random_stage2_600k.yaml"
      min_timesteps: 600000
      max_timesteps: 600000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/success_rate"
            op: ">="
            value: 0.40
    - name: "stage3"
      config: "random_full_stage3_300k.yaml"
      min_timesteps: 300000
      max_timesteps: 300000
      decision:
        action: "stop"
        logic: "all"
        conditions:
          - type: "plateau"
            metric: "valid/success_rate"
            mode: "max"
            window: 4
            min_delta: 0.02
