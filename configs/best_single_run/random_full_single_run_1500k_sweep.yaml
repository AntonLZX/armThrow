seed: 42
run_name: "sweep_1500k"

env:
  arm_urdf: "arm.urdf"
  render: false
  max_steps: 240
  end_effector_link_index: 3
  accel_scale: 50.0
  motor_force_limit: 50.0
  joint_velocity_limit: 10.0
  target_radius: 0.1
  release_success_bonus: 0.0
  reward_mode: "distance_progress"
  observation_mode: "arm_target_release"

  target:
    mode: "random"
    fixed: [2.0, 0.0, 0.5]
    random:
      x: [1.8, 2.2]
      y: [-0.2, 0.2]
      z: [0.4, 0.6]

algo:
  name: "PPO"
  total_timesteps: 1500000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

logging:
  name: "auto"
  save_dir: "runs"
  gif_every_n_episodes: 1000000
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["sweep", "ppo", "pybullet", "random-full", "1500k-cap"]
  notes: "Test single training run with 1500k steps"
  sync_tensorboard: false
  save_model: true

sweep:
  method: "bayes"       # bayes | random | grid

  metric:
    name: "eval/mean_reward"
    goal: "maximize"

  parameters:
    algo_name:
      values: ["PPO"]

    learning_rate:
      distribution: "log_uniform_values"
      min: 1.0e-5
      max: 1.0e-2

    gamma:
      values: [0.95, 0.99, 0.999]

    batch_size:
      values: [64, 128, 256, 512]

    # on-policy params (ignored by SAC / TD3 / DDPG via _build_algo_kwargs)
    n_steps:
      values: [512, 1024, 2048]

    n_epochs:
      values: [5, 10, 20]

    gae_lambda:
      values: [0.9, 0.95, 0.99]

    clip_range:
      values: [0.1, 0.2, 0.3]

    ent_coef:
      distribution: "log_uniform_values"
      min: 1.0e-4
      max: 0.1

