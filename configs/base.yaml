seed: 42
run_name: "ppo_arm_throw"

env:
  arm_urdf: "arm.urdf"
  render: false
  max_steps: 240
  end_effector_link_index: 3
  accel_scale: 50.0
  motor_force_limit: 50.0
  joint_velocity_limit: 10.0
  target_radius: 0.1
  release_success_bonus: 1.0
  observation_mode: "arm_target_release"
  
  # Reward shaping parameters
  reward_mode: "distance_progress"
  pre_release_action_penalty: 0.0001
  pre_release_const_penalty: 0.001
  progress_shaping_scale: 2.0
  progress_shaping_function: "exponential"
  progress_shaping_param: 1.5
  direction_reward_scale: 50.0  # Scale in angle-based reward formula: 1/(param*angle + 1/scale)
  direction_reward_param: 1.0   # Angle sensitivity (higher = steeper falloff)

  target:
    mode: "random"   # fixed or random
    fixed: [2.0, 0.0, 0.5]
    random:
      x: [1.8, 2.2]
      y: [-0.2, 0.2]
      z: [0.4, 0.6]

algo:
  name: "PPO"
  total_timesteps: 900000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

logging:
  name: "auto"
  save_dir: "runs"
  gif_every_n_episodes: 10000000
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["ppo", "pybullet"]
  notes: "testing wandb + tensorboard"
  sync_tensorboard: false
  save_model: true
