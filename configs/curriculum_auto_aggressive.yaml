seed: 42
run_name: "ppo_arm_throw_curriculum_auto_aggressive"

logging:
  save_dir: "runs"
  use_wandb: true
  project: "arm-throw"
  entity: "nus-me5406"
  tags: ["curriculum-auto", "aggressive"]
  notes: "Automatic curriculum runner with relative plateau switching and aggressive 150k/250k/400k budget caps"

curriculum:
  eval_freq: 5000
  n_eval_episodes: 20
  deterministic_eval: true
  stages:
    - name: "stage1"
      config: "fixed_center_stage1_150k.yaml"
      min_timesteps: 10000
      max_timesteps: 150000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/release_rate"
            op: ">="
            value: 0.95
            consecutive: 3
          - type: "threshold"
            metric: "valid/timeout_no_release_rate"
            op: "<="
            value: 0.05
            consecutive: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
    - name: "stage2"
      config: "narrow_random_stage2_250k_from_stage1_150k.yaml"
      min_timesteps: 100000
      max_timesteps: 250000
      decision:
        action: "switch"
        logic: "all"
        conditions:
          - type: "threshold"
            metric: "valid/min_distance_to_target"
            op: "<="
            value: 0.13
            consecutive: 3
          - type: "plateau"
            metric: "valid/min_distance_to_target"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 3
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
    - name: "stage3"
      config: "random_full_stage3_400k_after_stage2_250k.yaml"
      min_timesteps: 200000
      max_timesteps: 400000
      decision:
        action: "stop"
        logic: "all"
        conditions:
          - type: "plateau"
            metric: "valid/min_distance_to_target"
            mode: "min"
            window: 4
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
          - type: "plateau"
            metric: "valid/mean_final_distance"
            mode: "min"
            window: 4
            min_delta: 0.0
            rel_min_delta: 0.03
            patience: 3
